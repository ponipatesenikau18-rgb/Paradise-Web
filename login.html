<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--background);">

    <div class="page-card" style="width: 100%; max-width: 400px; padding: 40px; text-align: center;">
        <h1 style="margin-bottom: 20px;">Connect<span>.</span></h1>
        <p style="margin-bottom: 20px; color: var(--muted);">Welcome back! Please login.</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px;">
            <input type="password" id="password" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px;">
            
            <button type="submit" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
                Login
            </button>
        </form>
    </div>

</body>
</html>
